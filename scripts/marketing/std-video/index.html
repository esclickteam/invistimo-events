<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Save the Date — מיה ואלון</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&family=Heebo:wght@400;500;600;700;800&display=swap");
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px; height: 720px; overflow: hidden;
      background: #F4F0E8;
      font-family: "Heebo", sans-serif;
    }
    .stage {
      position: relative; width: 1280px; height: 720px;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(232, 196, 150, 0.45), transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(201, 164, 92, 0.22), transparent 45%),
        linear-gradient(165deg, #FFFDF8 0%, #F4F0E8 48%, #EADDC8 100%);
    }
    .bloom {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 180, 150, 0.55), rgba(201, 164, 92, 0.05) 55%, transparent 70%);
      opacity: 0; animation: bloomIn 1.4s ease forwards;
    }
    .bloom.a { width: 280px; height: 280px; top: 40px; right: 60px; animation-delay: 1.8s; }
    .bloom.b { width: 220px; height: 220px; bottom: 60px; left: 80px; animation-delay: 2.1s; }
    .bloom.c { width: 160px; height: 160px; top: 280px; left: 160px; animation-delay: 2.4s; }
    @keyframes bloomIn { to { opacity: 1; transform: scale(1.05); } }

    .gold-line {
      position: absolute; left: 50%; top: 118px; width: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #C9A45C, transparent);
      transform: translateX(-50%);
      animation: lineGrow 1.1s 0.6s ease forwards;
    }
    @keyframes lineGrow { to { width: 220px; } }

    .date {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: "Frank Ruhl Libre", serif;
      font-size: 92px; font-weight: 700; letter-spacing: 0.06em;
      color: #2C241C; opacity: 0; transform: translateY(18px);
      animation: rise 1.2s 0.4s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .names {
      position: absolute; left: 0; right: 0; top: 430px; text-align: center;
      font-family: "Frank Ruhl Libre", serif;
      font-size: 42px; font-weight: 600; color: #8B642B;
      opacity: 0; transform: translateY(14px);
      animation: rise 1s 1.5s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .kicker {
      position: absolute; left: 0; right: 0; top: 150px; text-align: center;
      font-size: 15px; font-weight: 800; letter-spacing: 0.32em; color: #C9A45C;
      opacity: 0; animation: rise 0.9s 0.15s ease forwards;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .card-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.92) translateY(24px);
      animation: cardIn 1.1s 3.4s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes cardIn { to { opacity: 1; transform: none; } }
    .card {
      width: 340px; height: 460px; border-radius: 22px; overflow: hidden;
      box-shadow: 0 40px 80px rgba(44,36,28,0.28);
      background: #1C1612;
      position: relative;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-badge {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: rgba(247,241,232,0.94); color: #2C241C;
      font-size: 13px; font-weight: 800; letter-spacing: 0.12em;
      padding: 8px 16px; border-radius: 999px; white-space: nowrap;
    }

    .wa {
      position: absolute; right: 72px; bottom: 48px; width: 360px;
      background: #ECE5DD; border-radius: 22px; padding: 14px;
      box-shadow: 0 24px 50px rgba(28,22,18,0.25);
      opacity: 0; transform: translateY(30px) scale(0.96);
      animation: waIn 1s 5.2s cubic-bezier(.2,.8,.2,1) forwards;
      font-family: "Heebo", sans-serif;
    }
    @keyframes waIn { to { opacity: 1; transform: none; } }
    .wa-bubble {
      background: #DCF8C6; border-radius: 12px 12px 4px 12px;
      padding: 14px 16px; color: #111B21; line-height: 1.55; font-size: 15px;
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    }
    .wa-bubble strong { display: block; font-size: 16px; margin-bottom: 6px; }
    .wa-meta { margin-top: 6px; text-align: left; font-size: 11px; color: #667781; }

    .finale {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at 50% 40%, rgba(255,253,248,0.96), rgba(244,240,232,0.98));
      opacity: 0; animation: finaleIn 1.1s 8.2s ease forwards;
    }
    @keyframes finaleIn { to { opacity: 1; } }
    .finale .fd {
      font-family: "Frank Ruhl Libre", serif; font-size: 64px; font-weight: 700; color: #2C241C;
    }
    .finale .fn {
      font-family: "Frank Ruhl Libre", serif; font-size: 34px; color: #8B642B;
    }
    .finale .fl {
      width: 160px; height: 1px; background: linear-gradient(90deg, transparent, #C9A45C, transparent);
    }

    /* Hide earlier layers when finale plays */
    .stage.finale-on .pre-finale { opacity: 0 !important; transition: opacity 0.6s ease; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bloom a pre-finale"></div>
    <div class="bloom b pre-finale"></div>
    <div class="bloom c pre-finale"></div>
    <div class="kicker pre-finale">SAVE THE DATE</div>
    <div class="gold-line pre-finale"></div>
    <div class="date pre-finale">24.06.2027</div>
    <div class="names pre-finale">מיה ואלון</div>

    <div class="card-wrap pre-finale">
      <div class="card">
        <img src="/marketing/invites/invite-wedding-mia-alon.webp" alt="" />
        <div class="card-badge">SAVE THE DATE</div>
      </div>
    </div>

    <div class="wa pre-finale">
      <div class="wa-bubble">
        <strong>Save The Date</strong>
        מיה ואלון
        <br /><br />
        אנחנו מתרגשים להזמין אתכם לשריין את התאריך
        <br />
        24.06.2027
        <br /><br />
        פרטים נוספים יישלחו בקרוב 🤍
        <div class="wa-meta">14:22 ✓✓</div>
      </div>
    </div>

    <div class="finale">
      <div class="fl"></div>
      <div class="fd">24.06.2027</div>
      <div class="fn">מיה ואלון</div>
      <div class="fl"></div>
    </div>
  </div>
  <script>
    setTimeout(() => document.getElementById("stage").classList.add("finale-on"), 8200);
  </script>
</body>
</html>
