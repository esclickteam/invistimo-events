<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>קישור אישי · הזמנה</title>
<style>
  html,body{margin:0;min-height:100%;background:#EDE4D6;font-family:Heebo,Arial,sans-serif;color:#2d241c}
  .browser{background:#F4EFE6;border-bottom:1px solid #E0D3BF;padding:10px 12px 12px}
  .dots{display:flex;gap:6px;margin-bottom:8px}
  .dots span{width:8px;height:8px;border-radius:50%;background:#D2C2AA;display:inline-block}
  .url{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E5D7C2;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;color:#7A6248}
  .url b{color:#B58A55;font-weight:900}
  .wrap{box-sizing:border-box;padding:22px 16px 40px;background:#F7F1E8;min-height:calc(100vh - 74px)}
  .eyebrow{margin:0;text-align:center;font-size:12px;font-weight:700;letter-spacing:.24em;color:#b58a55}
  h1{margin:12px 0 18px;text-align:center;font-size:28px;line-height:1.25;font-weight:900}
  .card{overflow:hidden;border-radius:26px;background:#faf7f1;box-shadow:0 18px 40px rgba(58,39,20,.12)}
  .card img{display:block;width:100%;height:auto;object-fit:contain;background:#faf7f1}
  .hint{margin:22px 16px 0;text-align:center;font-size:15px;font-weight:700;line-height:1.6;color:#5C4A3A}
</style>
</head>
<body>
  <div class="browser">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="url"><b>קישור אישי</b><span>invistimo.com/invite/meya-alon</span></div>
  </div>
  <div class="wrap">
    <p class="eyebrow">הזמנה לאירוע</p>
    <h1>החתונה של מיה ואלון</h1>
    <div class="card">
      <img alt="הזמנה" src="/rsvp-journey/invite.jpg"/>
    </div>
    <p class="hint">נשמח לדעת אם תגיעו לחגוג איתנו</p>
  </div>
</body>
</html>
